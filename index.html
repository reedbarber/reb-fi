  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reed E Barber</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #020617;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #020617, var(--bg));
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 2rem 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
      font-weight: 700;
    }

    header p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .links {
      display: grid;
      gap: 0.75rem;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 0.85rem 1rem;
      border-radius: 999px;
      background: #020617;
      border: 1px solid #1e293b;
      color: var(--text);
      font-weight: 500;
      transition: transform 0.15s ease, border-color 0.15s ease,
        background 0.15s ease;
    }

    .links a:hover,
    .links a:focus-visible {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
      outline: none;
    }

    footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (min-width: 640px) {
      .container {
        padding: 2.25rem 2rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Reed Barber aka "Erik"</h1>
      <p>My Links</p>
    </header>

    <nav class="links" aria-label="Primary links">
      <a href="https://reedbarber.org/emily/">emily ann barber</a>
      <a href="https://github.com/reedbarber">github</a>
      <a href="https://reedwrite.org">reed & write blog</a>
      <a href="https://portfolio.pixelfed.social/rbarber">pixelfed</a>
      <a href="https://www.threads.com/@_lonoak">_dreads </a>
      <a href="https://erik.barber.cc">micro blog</a>
      <a href="https://mastodon.social/@r_barber">mastodon</a>
      <a href="https://letterbird.co/reb">let's connect</a>

    </nav>
<br>
    <footer>
      ©2026 by Cactus Pixels * Made with HTML,CSS & Love *  Last updated 08/26
    </footer>
  </main>
</body>
</html>
    
  </body>
  
</html>
